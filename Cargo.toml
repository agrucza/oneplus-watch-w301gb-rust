[package]
name = "w301-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "stm32_app"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# HAL. We supply our own memory.x (app lives behind the bootloader), so the
# `memory-x` feature is deliberately NOT enabled.
# `low-power` and `executor-thread`: the HAL's own executor, which can put
# the processor into Stop mode when the firmware allows it (`hal::stop`),
# with the real-time clock keeping time across a stop.
embassy-stm32 = { version = "0.6", features = ["stm32l4r9zi", "dual-bank", "time-driver-any", "defmt", "unstable-pac", "low-power", "executor-thread"] }
embassy-executor = { version = "0.10", features = ["defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
# What the tasks share: a guarded value and a short queue.
embassy-sync = "0.8"
# Waiting for whichever of two things comes first. Already part of the
# build through the crates above.
embassy-futures = "0.1"
# The token the HAL asks for where interrupts must be off. Already part of
# the build through the crates above.
critical-section = "1"

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# set-sp / set-vtor: don't trust the state the bootloader hands us, re-load MSP
# and point VTOR at our own vector table (0x0801E000) before anything else runs.
cortex-m-rt = { version = "0.7.5", features = ["set-sp", "set-vtor"] }

embedded-sdmmc = { version = "0.10", default-features = false }
defmt = "1"
defmt-rtt = "1"
embedded-graphics = "0.8"

[profile.dev]
opt-level = 1          # unoptimised embedded code is painfully big/slow

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2              # debug info stays in the ELF, never reaches the flash

# The embassy crates come from one upstream commit instead of a release.
# The 0.6.0 release sets at most flash wait setting 4 for this chip family,
# which is only valid up to 100 MHz; the stock firmware runs at 120 MHz,
# which needs 5. Upstream fixed that on 2026-09-05 ("rcc: fix L4+ and L5
# high-speed clock setup"), with boost mode and the bus-divider step the
# chip requires. The commit pinned here (2026-11-18) also has what the
# processor's Stop mode needs on this family: a time base on LPTIM that
# builds for it (2026-11-17) and the clock restore after a stop. It needs
# Rust 1.100. Go back to a release once one contains these.
[patch.crates-io]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-executor-macros = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "9d4235376d04eb0d836a2e8b1cc35f78dd184388" }
