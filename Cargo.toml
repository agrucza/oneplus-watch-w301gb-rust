[package]
name = "w301-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "stm32_app"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# HAL. We supply our own memory.x (app lives behind the bootloader), so the
# `memory-x` feature is deliberately NOT enabled.
embassy-stm32 = { version = "0.6", features = ["stm32l4r9zi", "dual-bank", "time-driver-any", "defmt", "unstable-pac"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# set-sp / set-vtor: don't trust the state the bootloader hands us, re-load MSP
# and point VTOR at our own vector table (0x0801E000) before anything else runs.
cortex-m-rt = { version = "0.7.5", features = ["set-sp", "set-vtor"] }

embedded-sdmmc = { version = "0.10", default-features = false }
defmt = "1"
defmt-rtt = "1"
embedded-graphics = "0.8"
profont = "0.7"

[profile.dev]
opt-level = 1          # unoptimised embedded code is painfully big/slow

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2              # debug info stays in the ELF, never reaches the flash

# The embassy crates come from one upstream commit instead of the 0.6.0
# release: "rcc: fix L4+ and L5 high-speed clock setup" (2026-09-05). The
# release sets at most flash wait setting 4 for this chip family, which is
# only valid up to 100 MHz; the stock firmware runs at 120 MHz, which needs
# 5. This commit also switches boost mode on and steps the bus divider as
# the chip requires. It is the newest upstream state that builds with Rust
# 1.95. Go back to a release once one contains the fix.
[patch.crates-io]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-executor-macros = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-executor-timer-queue = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "e1b23ae02ad9d315d8fdb90973fc0992e6234e18" }
