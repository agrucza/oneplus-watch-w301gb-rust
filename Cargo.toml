[package]
name = "w301-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stm32_app"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# HAL. We supply our own memory.x (app lives behind the bootloader), so the
# `memory-x` feature is deliberately NOT enabled.
embassy-stm32 = { version = "0.6", features = ["stm32l4r9zi", "dual-bank", "time-driver-any", "exti", "defmt", "unstable-pac"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# set-sp / set-vtor: don't trust the state the bootloader hands us, re-load MSP
# and point VTOR at our own vector table (0x0801E000) before anything else runs.
cortex-m-rt = { version = "0.7.5", features = ["set-sp", "set-vtor"] }

embedded-sdmmc = { version = "0.10", default-features = false }
defmt = "1"
defmt-rtt = "1"

[profile.dev]
opt-level = 1          # unoptimised embedded code is painfully big/slow

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2              # debug info stays in the ELF, never reaches the flash
